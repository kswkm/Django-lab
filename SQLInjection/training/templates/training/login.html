<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SQL Injection 교육</title>
</head>
<body>
    <h1>SQL Injection 교육</h1>
    <p>시스템의 보안약점 여부를 테스트해 보세요.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <p>
            {{ form.user_id.label_tag }} {{ form.user_id }}
            {{ form.user_id.errors }}
        </p>
        <p>
            {{ form.password.label_tag }} {{ form.password }}
            {{ form.password.errors }}
        </p>
        <button type="submit" name="mode" value="vulnerable">❌ 취약코드검색</button>
        <button type="submit" name="mode" value="safe">✅ 안전코드검색</button>
    </form>

    <p><a href="{% url 'data' %}">인증 DB 데이터</a></p>
</body>
</html>
